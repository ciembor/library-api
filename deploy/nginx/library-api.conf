location = /library/api {
    return 301 /library/api/books;
}

location = /api-docs {
    return 301 /library/api-docs/;
}

location /api-docs/ {
    rewrite ^/api-docs/(.*)$ /library/api-docs/$1 permanent;
}

location = /library/api-docs {
    return 301 /library/api-docs/;
}

location /library/api-docs/ {
    proxy_pass http://127.0.0.1:3002/api-docs/;
    proxy_redirect /api-docs/ /library/api-docs/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /library/api/ {
    proxy_pass http://127.0.0.1:3002/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
